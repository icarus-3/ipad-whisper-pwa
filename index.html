<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iPad Whisper Test</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  padding:20px;
}
button{
  padding:12px;
  margin:5px;
  border-radius:10px;
}
#log{
  white-space:pre-wrap;
  background:#111;
  color:#0f0;
  padding:15px;
  border-radius:10px;
}
</style>

</head>

<body>

<h1>Whisper 本地测试</h1>

<button id="load">
加载 Whisper 模型
</button>

<button id="test">
测试推理
</button>

<div id="log">
等待...
</div>


<script type="module">

import {
pipeline,
env
}
from
"https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0";


env.allowLocalModels=false;
env.useBrowserCache=true;


const log=document.getElementById("log");


function print(x){
 log.textContent += "\n"+x;
}


let transcriber=null;


document
.getElementById("load")
.onclick=async()=>{

print("开始加载 Whisper...");

transcriber = await pipeline(
"automatic-speech-recognition",
"Xenova/whisper-small.en",
{
device:"webgpu",
progress_callback:(p)=>{
 print(JSON.stringify(p));
}
}
);


print("模型加载完成");


};



document
.getElementById("test")
.onclick=async()=>{


if(!transcriber){
 print("请先加载模型");
 return;
}


print("开始测试");


const result=
await transcriber(
"https://huggingface.co/datasets/Narsil/asr_dummy/resolve/main/mlk.flac"
);


print(
JSON.stringify(result,null,2)
);


};


</script>


</body>
</html>
