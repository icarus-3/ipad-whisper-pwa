<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>iPad Whisper Live v0.2</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}*{box-sizing:border-box}body{margin:0;background:#09090a;color:#f5f5f7}main{max-width:880px;margin:0 auto;padding:24px 18px 80px}h1{font-size:26px;margin:0 0 8px}.small{color:#aaa;font-size:14px}.card{border:1px solid #333;border-radius:16px;padding:16px;margin:14px 0;background:#101012}button{font:inherit;padding:12px 16px;border-radius:12px;border:1px solid #444;background:#242428;color:#fff;margin:4px 6px 4px 0}button:disabled{opacity:.4}.status{margin-top:10px;color:#bbb;white-space:pre-wrap}.ok{color:#65d47e}.err{color:#ff6b6b}#barOuter,#meterOuter{height:8px;background:#28282c;border-radius:999px;overflow:hidden;margin-top:10px}#bar,#meter{height:100%;width:0;background:#ddd}#live{font-size:24px;line-height:1.5;min-height:110px;white-space:pre-wrap}#history{font-size:16px;line-height:1.7;white-space:pre-wrap;color:#ddd}
</style>
</head>
<body><main>
<h1>iPad Whisper Live v0.2</h1>
<div class="small">本地麦克风 → 48 kHz → 16 kHz → Whisper Tiny → 英文字幕</div>
<div class="card"><button id="loadBtn">1. 加载 Whisper</button><div id="modelStatus" class="status">尚未加载模型</div><div id="barOuter"><div id="bar"></div></div></div>
<div class="card"><button id="startBtn" disabled>2. 开始实时转写</button><button id="stopBtn" disabled>停止</button><button id="clearBtn">清空字幕</button><div id="audioStatus" class="status">麦克风未启动</div><div id="meterOuter"><div id="meter"></div></div></div>
<div class="card"><div class="small">最近一段（约每 5 秒更新）</div><div id="live">等待语音…</div></div>
<div class="card"><div class="small">累计 transcript</div><div id="history"></div></div>
<div class="card"><div class="small">调试信息</div><div id="debug" class="status"></div></div>
</main>
<script type="module">
import { pipeline, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";
env.allowLocalModels=false; env.useBrowserCache=true;
const $=id=>document.getElementById(id); const modelStatus=$("modelStatus"),audioStatus=$("audioStatus"),debug=$("debug");
let transcriber=null,stream=null,ctx=null,source=null,worklet=null,muteGain=null,workletURL=null;
let queue=[],queuedSamples=0,processing=false,running=false,sourceRate=48000; const chunkSeconds=5;
function setError(el,e){el.innerHTML='<span class="err">错误：</span> '+String(e)}
function formatBytes(n){if(!Number.isFinite(n))return"";return n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(1)+" MB"}
$("loadBtn").onclick=async()=>{ $("loadBtn").disabled=true; modelStatus.textContent="开始加载模型…首次需要联网下载。"; try{
 transcriber=await pipeline("automatic-speech-recognition","onnx-community/whisper-tiny.en",{device:"webgpu",dtype:"q4",progress_callback:p=>{if(p.status==="progress"&&Number.isFinite(p.progress)){ $("bar").style.width=Math.max(0,Math.min(100,p.progress))+"%"; modelStatus.textContent=`下载/加载：${p.file??""}\n${p.progress.toFixed(1)}% ${formatBytes(p.loaded??0)} / ${formatBytes(p.total??0)}` }}});
 modelStatus.innerHTML='<span class="ok">Whisper Tiny 已加载 ✅</span><br>设备：WebGPU，量化：q4'; $("bar").style.width="100%"; $("startBtn").disabled=false;
 }catch(e){setError(modelStatus,e);$("loadBtn").disabled=false;}};
function takeSamples(n){const out=new Float32Array(n);let off=0;while(off<n&&queue.length){const f=queue[0],need=n-off;if(f.length<=need){out.set(f,off);off+=f.length;queuedSamples-=f.length;queue.shift()}else{out.set(f.subarray(0,need),off);queue[0]=f.slice(need);queuedSamples-=need;off+=need}}return out}
function resampleLinear(input,inRate,outRate){if(inRate===outRate)return input;const ratio=inRate/outRate,L=Math.floor(input.length/ratio),out=new Float32Array(L);for(let i=0;i<L;i++){const pos=i*ratio,l=Math.floor(pos),r=Math.min(l+1,input.length-1),a=pos-l;out[i]=input[l]*(1-a)+input[r]*a}return out}
function rmsOf(x){let s=0;for(let i=0;i<x.length;i++)s+=x[i]*x[i];return Math.sqrt(s/Math.max(1,x.length))}
async function processNext(){if(!running||processing||!transcriber)return;const need=Math.round(sourceRate*chunkSeconds);if(queuedSamples<need)return;processing=true;const raw=takeSamples(need),audio16=resampleLinear(raw,sourceRate,16000),rms=rmsOf(audio16);debug.textContent=`队列：${(queuedSamples/sourceRate).toFixed(1)} s\n当前块：${chunkSeconds}s → ${audio16.length} samples @16kHz\nRMS：${rms.toFixed(5)}\n正在推理…`;try{if(rms<0.0015){$("live").textContent="（静音，已跳过）"}else{const t0=performance.now(),result=await transcriber(audio16),dt=(performance.now()-t0)/1000,text=(result?.text??"").trim();$("live").textContent=text||"（未识别到文字）";if(text){const time=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});$("history").textContent+=`[${time}] ${text}\n`}debug.textContent=`队列：${(queuedSamples/sourceRate).toFixed(1)} s\n推理耗时：${dt.toFixed(2)} s\n实时倍率：${(dt/chunkSeconds).toFixed(2)}×`}}catch(e){setError(debug,e)}finally{processing=false;setTimeout(processNext,0)}}
async function makeWorklet(){const code=`class CaptureProcessor extends AudioWorkletProcessor{constructor(){super();this.buf=new Float32Array(4096);this.pos=0}process(inputs){const ch=inputs[0]&&inputs[0][0];if(ch){let i=0;while(i<ch.length){const n=Math.min(ch.length-i,this.buf.length-this.pos);this.buf.set(ch.subarray(i,i+n),this.pos);this.pos+=n;i+=n;if(this.pos===this.buf.length){const send=this.buf;this.port.postMessage(send,[send.buffer]);this.buf=new Float32Array(4096);this.pos=0}}}return true}}registerProcessor("capture-processor",CaptureProcessor);`;const blob=new Blob([code],{type:"text/javascript"});workletURL=URL.createObjectURL(blob);await ctx.audioWorklet.addModule(workletURL)}
$("startBtn").onclick=async()=>{$("startBtn").disabled=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});ctx=new AudioContext();await ctx.resume();sourceRate=ctx.sampleRate;await makeWorklet();source=ctx.createMediaStreamSource(stream);worklet=new AudioWorkletNode(ctx,"capture-processor");muteGain=ctx.createGain();muteGain.gain.value=0;source.connect(worklet);worklet.connect(muteGain);muteGain.connect(ctx.destination);queue=[];queuedSamples=0;processing=false;running=true;worklet.port.onmessage=ev=>{if(!running)return;const data=new Float32Array(ev.data);queue.push(data);queuedSamples+=data.length;const rms=rmsOf(data);$("meter").style.width=Math.min(100,rms*800)+"%";audioStatus.innerHTML=`<span class="ok">麦克风工作中 ✅</span><br>输入采样率：${sourceRate} Hz<br>每 ${chunkSeconds} 秒执行一次 Whisper`;processNext()};$("stopBtn").disabled=false}catch(e){setError(audioStatus,e);$("startBtn").disabled=false}};
$("stopBtn").onclick=async()=>{running=false;$("stopBtn").disabled=true;try{worklet?.disconnect()}catch{}try{source?.disconnect()}catch{}try{muteGain?.disconnect()}catch{}try{stream?.getTracks().forEach(t=>t.stop())}catch{}try{await ctx?.close()}catch{}if(workletURL)URL.revokeObjectURL(workletURL);stream=ctx=source=worklet=muteGain=null;queue=[];queuedSamples=0;$("meter").style.width="0%";audioStatus.textContent="已停止";$("startBtn").disabled=!transcriber};
$("clearBtn").onclick=()=>{$("live").textContent="等待语音…";$("history").textContent="";debug.textContent=""};
document.addEventListener("visibilitychange",()=>{if(document.hidden&&running)audioStatus.innerHTML='<span class="err">页面进入后台：iPad 可能暂停麦克风。请保持本页前台。</span>'});
</script></body></html>
